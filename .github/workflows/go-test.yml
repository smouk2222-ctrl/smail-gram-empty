name: Go tests

on:
  # The PR event already tests every topic-branch push. Restrict push runs
  # to main so each commit on an open PR does not enqueue the same suite twice.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Keep only the newest validation for a PR/ref. Older queued test runs are
# redundant and can delay feedback after a branch receives several commits.
concurrency:
  group: go-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Test the immutable PR head SHA. GitHub can retire an old synthetic
          # merge ref while queued runs wait behind other jobs, making checkout
          # fail before tests even start.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Keep the security-sensitive admin console tests visible as their own
      # result even if unrelated packages in the full repository suite fail.
      - name: Test admin console
        run: go test ./cmd/telesrv-admin
      - name: Build server executables
        run: |
          go build ./cmd/telesrv
          go build ./cmd/telesrv-admin
          go build ./cmd/owpengram-ctl
      - name: Run full test suite
        run: go test ./...
