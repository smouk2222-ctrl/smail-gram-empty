name: Go tests

on:
  # The PR event already tests every topic-branch push. Restrict push runs
  # to main so each commit on an open PR does not enqueue the same suite twice.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Test the immutable PR head SHA. GitHub can retire an old synthetic
          # merge ref while queued runs wait behind other jobs, making checkout
          # fail before tests even start.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
